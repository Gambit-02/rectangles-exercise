[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rectangles"
version = "1.0.0"
description = "Intersection, containment and adjacency analysis for axis aligned rectangles"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jude Laskey" }]
dependencies = []

[project.scripts]
rectangles = "rectangles.cli:main"

[tool.setuptools]
packages = ["rectangles"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
