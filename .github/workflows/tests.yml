name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the unit tests (standard library only)
        run: python -m unittest -v
      - name: Run the demo
        run: python -m rectangles demo
      - name: Install the package and use the console script
        run: |
          python -m pip install .
          cd /tmp
          rectangles analyze 0,0,4,4 2,2,6,6
